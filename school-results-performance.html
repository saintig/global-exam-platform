<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14243a">
<title>Results &amp; Performance | SAINTIG EXAMS</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--navy:#14243a;--navy2:#1d3554;--gold:#d4af37;--paper:#f5f7fa;--ink:#1e293b;--muted:#64748b;--line:#e5e9ef;--red:#b42318;--green:#16834a}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.55 Arial,sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
.app{min-height:100vh;display:grid;grid-template-columns:285px 1fr}
.sidebar{background:var(--navy);color:#fff;padding:20px 15px;display:flex;flex-direction:column;min-height:100vh}
.brand{display:flex;gap:11px;align-items:center;padding:5px 8px 20px;border-bottom:1px solid #ffffff20}
.mark{width:44px;height:44px;border-radius:11px;background:var(--gold);color:var(--navy);display:grid;place-items:center;font-weight:800}
.brand b{font-size:18px}.brand small{display:block;color:#bdc8d5;font-size:12px;letter-spacing:1.2px}
.navlabel{font-size:13px;color:#9eacbd;letter-spacing:1.4px;font-weight:bold;padding:20px 10px 8px}
nav{display:grid;gap:4px}
nav button{border:0;background:none;color:#dce4ed;text-align:left;padding:12px;border-radius:8px;font-size:16px}
nav button:hover,nav button.active{background:var(--navy2);color:#fff}
nav button.active{box-shadow:inset 3px 0 var(--gold)}
.account{margin-top:auto;border-top:1px solid #ffffff20;padding:15px 5px 10px;display:flex;align-items:center;gap:10px}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--gold);color:var(--navy);display:grid;place-items:center;font-weight:bold;flex-shrink:0}
.accountname{font-size:15px;font-weight:bold;overflow-wrap:anywhere}.accounttype{font-size:14px;color:#bdc8d5}
.signout{width:100%;padding:12px;border:1px solid #ffffff30;background:none;color:#ffd4d1;border-radius:8px}
.main{min-width:0}
.topbar{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:4}
.top-title{font-weight:bold;color:var(--navy);font-size:18px}
.topright{color:var(--muted)}
.menu{display:none}
.content{padding:28px;max-width:1300px;margin:auto}
h1{font-size:30px;color:var(--navy);margin:0 0 6px}
.muted{color:var(--muted)}
.tabs{display:flex;gap:10px;margin:18px 0 14px;flex-wrap:wrap}
.tab{flex:1;min-width:200px;padding:15px;border-radius:12px;font-weight:bold;font-size:17px;border:2px solid var(--line);background:#fff;color:var(--navy)}
.tab.on{background:var(--navy);color:#fff;border-color:var(--gold)}
.spacenote{background:#eef6ff;border:1px solid #d5e8fa;color:#31577b;border-radius:10px;padding:13px 15px;margin:0 0 18px}
.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:20px;box-shadow:0 7px 22px #14243a0b;margin-bottom:18px}
.card h2{font-size:21px;color:var(--navy);margin:0 0 4px}
.filters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:14px}
.f label{display:block;font-weight:bold;font-size:15px;margin-bottom:6px;color:#34415a}
.f select,.f input{width:100%;padding:12px;border:1px solid #cfd6e2;border-radius:8px;background:#fff;min-height:50px;font-size:17px}
.f select:disabled{background:#f1f4f8;color:#8a97a8}
.cards{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:18px}
.sc{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px;box-shadow:0 5px 16px #14243a08}
.sc span{display:block;color:var(--muted);font-size:14px}
.sc strong{display:block;font-size:27px;color:var(--navy);margin-top:4px}
.subtabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.st{border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:999px;padding:11px 18px;font-weight:bold;min-height:48px}
.st.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}
.bar .f{flex:1;min-width:200px}
.btn{border:0;border-radius:9px;padding:12px 17px;font-weight:bold;min-height:50px;font-size:16px}
.btn.gold{background:var(--gold);color:var(--navy)}.btn.light{background:#edf1f6;color:var(--navy)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.msg{display:none;padding:13px 15px;border-radius:9px;margin:0 0 16px;overflow-wrap:anywhere}
.msg.show{display:block}.msg.err{background:#fff0ef;border:1px solid #ffd2ce;color:var(--red)}.msg.info{background:#eef6ff;border:1px solid #d5e8fa;color:#31577b}
.wrapx{overflow-x:auto}
table{width:100%;min-width:720px;border-collapse:collapse;font-size:16px}
th{background:#f5f7fa;color:var(--navy);text-align:left;padding:12px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 9px;border-bottom:1px solid var(--line);color:#3d4a5c;vertical-align:top}
td small{display:block;color:var(--muted);font-size:13px}
.pass{color:var(--green);font-weight:bold}.fail{color:var(--red);font-weight:bold}
.pager{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.empty{text-align:center;color:var(--muted);padding:34px 10px}
.overlay{display:none}
@media(max-width:1100px){.cards{grid-template-columns:repeat(3,minmax(0,1fr))}.filters{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:720px){
 .app{display:block}
 .sidebar{position:fixed;z-index:12;inset:0 auto 0 0;width:295px;min-height:0;height:100dvh;overflow-y:auto;transform:translateX(-105%);transition:transform .22s;box-shadow:10px 0 25px #0002}
 .sidebar.open{transform:translateX(0)}
 .overlay.show{display:block;position:fixed;inset:0;z-index:11;background:#0007}
 .menu{display:inline-block;border:1px solid var(--line);background:#fff;border-radius:7px;padding:8px 12px;margin-right:11px;color:var(--navy);font-size:18px}
 .topbar{height:64px;padding:0 14px}.topright{display:none}
 .content{padding:18px 14px}h1{font-size:26px}
 .filters{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media print{
 .sidebar,.topbar,.tabs,.spacenote,.filters-card,.subtabs,.bar,.pager,.msg,.overlay,.noprint{display:none!important}
 .app{display:block}.content{padding:0}.card,.sc{box-shadow:none}
 table{min-width:0;font-size:12px}
}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="brand"><div class="mark">SE</div><div><b>SAINTIG EXAMS</b><small>EXAMINATION PLATFORM</small></div></div>
  <div class="navlabel" id="menuLabel">MAIN MENU</div>
  <nav id="mainNav"></nav>
  <div class="navlabel">ACCOUNT</div>
  <nav id="accNav"></nav>
  <div class="account"><div class="avatar" id="sideAvatar">SE</div>
    <div><div class="accountname" id="sideName">Loading…</div><div class="accounttype" id="sideType">Teacher/School</div></div></div>
  <button class="signout" id="signOutBtn" type="button">↪ &nbsp; Sign Out</button>
</aside>
<div class="overlay" id="overlay"></div>

<main class="main">
<header class="topbar">
  <div><button class="menu" id="menuBtn" type="button" aria-label="Open menu">☰</button><span class="top-title">Results &amp; Performance</span></div>
  <div class="topright" id="topAccount">Loading…</div>
</header>

<section class="content">
  <h1>Results &amp; Performance</h1>
  <div class="muted">See how students performed in each examination.</div>

  <div class="tabs">
    <button class="tab" data-s="teacher" type="button">Teacher's Examination</button>
    <button class="tab" data-s="class" type="button">School Class Examinations</button>
  </div>
  <div class="spacenote" id="spaceNote"></div>
  <div class="msg" id="msg"></div>

  <section class="card filters-card">
    <h2>Choose what to see</h2>
    <p class="muted">Archived classes, subjects, students and examinations are never listed here.</p>
    <div class="filters" id="filters"></div>
  </section>

  <div class="cards" id="cards"></div>

  <section class="card">
    <div class="subtabs">
      <button class="st on" data-st="results" type="button">Results</button>
      <button class="st" data-st="exams" type="button">By Examination</button>
      <button class="st" data-st="students" type="button">By Student</button>
    </div>
    <div class="bar">
      <div class="f"><label for="search">Search</label><input id="search" type="search" placeholder="Student name, Student ID or examination"></div>
      <button class="btn light" id="csvBtn" type="button">Download CSV</button>
      <button class="btn gold" id="printBtn" type="button">Print</button>
    </div>
    <div id="table"><div class="empty">Loading…</div></div>
    <div class="pager" id="pager"></div>
  </section>
</section>
</main>
</div>

<script>
const SB_URL="https://scuiswponnqyrbqjypkx.supabase.co",SB_KEY="sb_publishable_3fT0c2Ggy8sYKINoMkMpkA_Qlaj5oZq",LOGIN="school-login.html";
const sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const num=(v,d=0)=>Number(v||0).toLocaleString(undefined,{maximumFractionDigits:d});
const pc=v=>v===null||v===undefined||!Number.isFinite(v)?"—":v.toFixed(1)+"%";
const PASS=50, PAGE=25, ACTIVE="is_archived.is.false,is_archived.is.null";
const TERMS=["1st Term","2nd Term","3rd Term"];

const THIS_PAGE="school-results-performance.html";
const MENU={
 teacher:[["▦ Dashboard","school-dashboard.html"],["♙ My Students","school-students.html"],["▤ My Subjects","school-subjects.html"],["＋ Register Examination","register-examination.html"],["▣ Question Bank","school-question-bank.html"],["▧ Archive Management","school-archive-management.html"],["▥ Results & Performance",THIS_PAGE]],
 class:[["▦ Dashboard","school-dashboard.html"],["🏫 Classes & Terms","school-classes.html"],["▤ Class Subjects","class-subjects.html"],["♙ Class Students","class-students.html"],["＋ Class Examinations","class-examinations.html"],["▣ Class Question Bank","class-question-bank.html"],["🔗 Attach Students & Examinations","class-attach.html"],["▥ Class Results","school-class-results.html"],["📊 Class Performance",THIS_PAGE],["▧ Archive Management","school-archive-management.html"]]
};
const ACCOUNT=[["◇ Subscription Plans","school-subscription-plans.html"],["♧ Notifications","school-notifications.html"],["⚙ Teacher/School Profile","school-my-profile.html"],["? Help & Support","school-help-support.html"],["ⓘ About","about.html"],["✉ Contact","contact.html"]];
const NOTE={
 teacher:"Teacher's Examination: results of the students and examinations in this tab only.",
 class:"School Class Examinations: results by class and term. Only active classes are listed."
};

let space=localStorage.getItem("saintig_space")==="class"?"class":"teacher",acc=null;
const cache={teacher:null,class:null};
const S={sub:"results",page:1,search:"",f:{group:"",term:"",subject:"",exam:"",mode:"best"},view:{results:[],exams:[],students:[]}};

function say(t,k="info"){const e=$("msg");e.textContent=t;e.className="msg show "+k}
function hush(){$("msg").className="msg"}

/* ---------- menus and tabs ---------- */
function paint(){
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.s===space));
  $("menuLabel").textContent=space==="class"?"SCHOOL CLASS EXAMINATIONS":"TEACHER'S EXAMINATION";
  $("mainNav").innerHTML=MENU[space].map(m=>`<button type="button" data-u="${m[1]}"${m[1]===THIS_PAGE?' class="active"':""}>${m[0]}</button>`).join("");
  $("spaceNote").textContent=NOTE[space];
}
$("accNav").innerHTML=ACCOUNT.map(a=>`<button type="button" data-u="${a[1]}">${a[0]}</button>`).join("");
document.addEventListener("click",e=>{
  const b=e.target.closest("button[data-u]");
  if(b){if(b.dataset.u!==THIS_PAGE)location.href=b.dataset.u;else closeMenu();return}
  const t=e.target.closest(".tab");
  if(t&&t.dataset.s!==space){space=t.dataset.s;localStorage.setItem("saintig_space",space);S.f={group:"",term:"",subject:"",exam:"",mode:S.f.mode};S.page=1;paint();show()}
  const st=e.target.closest(".st");
  if(st){S.sub=st.dataset.st;S.page=1;document.querySelectorAll(".st").forEach(x=>x.classList.toggle("on",x===st));draw()}
});
function closeMenu(){$("sidebar").classList.remove("open");$("overlay").classList.remove("show")}
$("menuBtn").addEventListener("click",()=>{const o=$("sidebar").classList.toggle("open");$("overlay").classList.toggle("show",o)});
$("overlay").addEventListener("click",closeMenu);
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeMenu()});

/* ---------- loading data for one tab ---------- */
async function fetchAll(make){
  const out=[];
  for(let from=0;;from+=1000){
    const r=await make().range(from,from+999);
    if(r.error)throw r.error;
    const rows=r.data||[];out.push(...rows);
    if(rows.length<1000)break;
  }
  return out;
}
async function loadSpaceData(sp){
  /* Archived records are left out here, so they can never reach a dropdown. */
  const mine=t=>()=>sb.from(t).select("*").eq("school_account_id",acc.id).eq("space",sp).or(ACTIVE).order("id");
  const [subjects,students,exams0]=await Promise.all([fetchAll(mine("school_subjects")),fetchAll(mine("school_students")),fetchAll(mine("examinations"))]);

  let classes=[],levels=[],exams=exams0,linked=true;
  if(sp==="class"){
    const rows=await fetchAll(()=>sb.from("school_classes").select("*").eq("school_account_id",acc.id).or(ACTIVE).order("id"));
    classes=rows.filter(c=>c.class_group_id&&!c.is_legacy&&!c.is_graduated&&!c.is_promoted&&String(c.status||"")!=="promoted");
    const lv=await sb.from("class_levels").select("code,name,alt_name");levels=lv.data||[];
    linked=exams0.length===0||exams0.some(e=>"school_class_id" in e);
    if(linked){const ids=new Set(classes.map(c=>String(c.id)));exams=exams0.filter(e=>ids.has(String(e.school_class_id)))}
  }

  const studentIds=new Set(students.map(s=>String(s.id)));
  const examIds=exams.map(e=>e.id);
  let attempts=[];
  for(let i=0;i<examIds.length;i+=100){
    const part=await fetchAll(()=>sb.from("exam_attempts").select("*").eq("school_account_id",acc.id).in("examination_id",examIds.slice(i,i+100)).order("id"));
    attempts.push(...part);
  }
  attempts=attempts.filter(a=>a.status!=="in_progress"&&studentIds.has(String(a.student_id)));
  return{subjects,students,exams,classes,levels,attempts,linked};
}
async function show(){
  hush();$("table").innerHTML='<div class="empty">Loading results…</div>';$("pager").innerHTML="";$("cards").innerHTML="";$("filters").innerHTML="";
  const sp=space;
  try{
    if(!cache[sp])cache[sp]=await loadSpaceData(sp);
    if(sp!==space)return;
    if(sp==="class"&&!cache[sp].linked)say("Examinations are not linked to classes in your database yet, so the class and term filters are unavailable.","info");
    draw();
  }catch(e){
    console.error(e);
    $("table").innerHTML='<div class="empty">Results could not be loaded.</div>';
    say("Results could not be loaded: "+(e.message||e)+". If this keeps happening, the database may not allow this page to read examination attempts.","err");
  }
}

/* ---------- filtering and calculation ---------- */
const levelLabel=(D,code)=>{const l=D.levels.find(x=>x.code===code);return l?l.name+" — "+l.alt_name:null};
function groupsOf(D){
  const m=new Map();
  D.classes.forEach(c=>{if(!m.has(c.class_group_id))m.set(c.class_group_id,[]);m.get(c.class_group_id).push(c)});
  return [...m.entries()].map(([key,rows])=>{
    rows.sort((a,b)=>TERMS.indexOf(a.academic_period)-TERMS.indexOf(b.academic_period));
    const f=rows[0];
    return{key,rows,label:(levelLabel(D,f.level_code)||f.class_name)+(f.class_arm?" · "+f.class_arm:"")+" ("+f.academic_session+")"};
  });
}
function selectedExams(D){
  const f=S.f;let exs=D.exams;
  if(space==="class"&&D.linked){
    const g=groupsOf(D).find(x=>String(x.key)===String(f.group));
    if(g){
      const rows=f.term?g.rows.filter(r=>r.academic_period===f.term):g.rows;
      const ids=new Set(rows.map(r=>String(r.id)));
      exs=exs.filter(e=>ids.has(String(e.school_class_id)));
    }
  }
  return exs;
}
function computeRows(D){
  const f=S.f;
  let exs=selectedExams(D);
  const afterClass=exs;
  if(f.subject)exs=exs.filter(e=>String(e.school_subject_id)===String(f.subject));
  const afterSubject=exs;
  if(f.exam)exs=exs.filter(e=>String(e.id)===String(f.exam));

  const exMap=new Map(D.exams.map(e=>[String(e.id),e]));
  const stMap=new Map(D.students.map(s=>[String(s.id),s]));
  const subMap=new Map(D.subjects.map(s=>[String(s.id),s]));
  const classMap=new Map(D.classes.map(c=>[String(c.id),c]));
  const ids=new Set(exs.map(e=>String(e.id)));

  let rows=D.attempts.filter(a=>ids.has(String(a.examination_id))).map(a=>{
    const ex=exMap.get(String(a.examination_id))||{},st=stMap.get(String(a.student_id))||{},sub=subMap.get(String(ex.school_subject_id))||{};
    let total=Number(a.total_marks);
    if(!(total>0))total=Number(ex.student_question_count||a.question_count||0)*Number(ex.marks_per_question||1);
    const score=Number(a.score);
    const p=total>0&&Number.isFinite(score)?score/total*100:null;
    const cl=classMap.get(String(ex.school_class_id));
    return{id:a.id,sid:String(a.student_id),eid:String(a.examination_id),student:st.full_name||"Student",code:st.student_id||"—",
      exam:ex.title||"Examination",examCode:ex.examination_code||"",subject:sub.subject_name||"—",
      classTerm:cl?((levelLabel(D,cl.level_code)||cl.class_name)+(cl.class_arm?" · "+cl.class_arm:"")+" · "+cl.academic_period):"",
      score:Number.isFinite(score)?score:null,total:total>0?total:null,p,when:a.submitted_at||a.started_at};
  });

  if(f.mode==="best"){
    const best=new Map();
    rows.forEach(r=>{
      const k=r.sid+"|"+r.eid,cur=best.get(k);
      if(!cur||(r.p??-1)>(cur.p??-1)||((r.p??-1)===(cur.p??-1)&&new Date(r.when)>new Date(cur.when)))best.set(k,r);
    });
    rows=[...best.values()];
  }
  rows.sort((a,b)=>new Date(b.when)-new Date(a.when));
  return{rows,exs,afterClass,afterSubject};
}
function stats(list){
  const v=list.map(r=>r.p).filter(x=>x!==null);
  return{n:list.length,students:new Set(list.map(r=>r.sid)).size,avg:v.length?v.reduce((a,b)=>a+b,0)/v.length:null,
    hi:v.length?Math.max(...v):null,lo:v.length?Math.min(...v):null,pass:v.length?v.filter(x=>x>=PASS).length/v.length*100:null};
}

/* ---------- drawing ---------- */
function opts(list,val,first,vf,lf){
  return `<option value="">${esc(first)}</option>`+list.map(x=>`<option value="${esc(vf(x))}" ${String(vf(x))===String(val)?"selected":""}>${esc(lf(x))}</option>`).join("");
}
function drawFilters(D,calc){
  const f=S.f;let h="";
  if(space==="class"&&D.linked){
    const gs=groupsOf(D),g=gs.find(x=>String(x.key)===String(f.group));
    h+=`<div class="f"><label for="fGroup">Class</label><select id="fGroup">${opts(gs,f.group,"All active classes",x=>x.key,x=>x.label)}</select></div>`;
    h+=`<div class="f"><label for="fTerm">Term</label><select id="fTerm" ${g?"":"disabled"}>${opts(g?g.rows:[],f.term,"All terms",x=>x.academic_period,x=>x.academic_period)}</select></div>`;
  }
  const subs=D.subjects.filter(s=>calc.afterClass.some(e=>String(e.school_subject_id)===String(s.id)));
  h+=`<div class="f"><label for="fSub">Subject</label><select id="fSub">${opts(subs,f.subject,"All subjects",x=>x.id,x=>x.subject_name)}</select></div>`;
  h+=`<div class="f"><label for="fExam">Examination</label><select id="fExam">${opts(calc.afterSubject,f.exam,"All examinations",x=>x.id,x=>(x.title||"Examination")+(x.examination_code?" — "+x.examination_code:""))}</select></div>`;
  h+=`<div class="f"><label for="fMode">Attempts</label><select id="fMode"><option value="best" ${f.mode==="best"?"selected":""}>Best attempt per student</option><option value="all" ${f.mode==="all"?"selected":""}>All attempts</option></select></div>`;
  $("filters").innerHTML=h;

  const on=(id,fn)=>{const e=$(id);if(e)e.addEventListener("change",()=>{fn(e.value);S.page=1;draw()})};
  on("fGroup",v=>{f.group=v;f.term="";f.subject="";f.exam=""});
  on("fTerm",v=>{f.term=v;f.subject="";f.exam=""});
  on("fSub",v=>{f.subject=v;f.exam=""});
  on("fExam",v=>{f.exam=v});
  on("fMode",v=>{f.mode=v});
}
function draw(){
  const D=cache[space];if(!D)return;
  const calc=computeRows(D);
  drawFilters(D,calc);

  const st=stats(calc.rows);
  $("cards").innerHTML=[["Results shown",num(st.n)],["Students",num(st.students)],["Average",pc(st.avg)],["Highest",pc(st.hi)],["Lowest",pc(st.lo)],["Pass rate (≥"+PASS+"%)",pc(st.pass)]]
    .map(([a,b])=>`<div class="sc"><span>${a}</span><strong>${b}</strong></div>`).join("");

  const q=S.search.toLowerCase().trim();
  const isClass=space==="class";

  if(S.sub==="results"){
    let rows=calc.rows.filter(r=>!q||(r.student+" "+r.code+" "+r.exam+" "+r.examCode).toLowerCase().includes(q));
    const head=["Student","Student ID","Examination","Subject"].concat(isClass?["Class / Term"]:[],["Score","Percentage","Result","Submitted"]);
    const data=rows.map(r=>[r.student,r.code,r.exam+(r.examCode?" ("+r.examCode+")":""),r.subject].concat(isClass?[r.classTerm||"—"]:[],
      [r.score===null?"—":num(r.score,2)+(r.total?" / "+num(r.total,2):""),pc(r.p),r.p===null?"—":(r.p>=PASS?"Pass":"Fail"),r.when?new Date(r.when).toLocaleString():"—"]));
    S.view.results={head,data};
    return table(head,data,{resultCol:head.indexOf("Result")});
  }
  if(S.sub==="exams"){
    let list=calc.exs.map(e=>{
      const rs=calc.rows.filter(r=>r.eid===String(e.id)),s=stats(rs);
      const sub=D.subjects.find(x=>String(x.id)===String(e.school_subject_id));
      return{e,s,sub};
    }).filter(x=>!q||((x.e.title||"")+" "+(x.e.examination_code||"")).toLowerCase().includes(q));
    list.sort((a,b)=>(b.s.avg??-1)-(a.s.avg??-1));
    const head=["Examination","Exam ID","Subject","Students","Average","Highest","Lowest","Pass rate"];
    const data=list.map(x=>[x.e.title||"Examination",x.e.examination_code||"—",x.sub?x.sub.subject_name:"—",num(x.s.students),pc(x.s.avg),pc(x.s.hi),pc(x.s.lo),pc(x.s.pass)]);
    S.view.exams={head,data};
    return table(head,data,{});
  }
  /* by student */
  const by=new Map();
  calc.rows.forEach(r=>{if(!by.has(r.sid))by.set(r.sid,[]);by.get(r.sid).push(r)});
  let list=[...by.entries()].map(([sid,rs])=>{const s=stats(rs);return{name:rs[0].student,code:rs[0].code,exams:new Set(rs.map(r=>r.eid)).size,s}})
    .filter(x=>!q||(x.name+" "+x.code).toLowerCase().includes(q));
  list.sort((a,b)=>(b.s.avg??-1)-(a.s.avg??-1));
  const head=["Position","Student","Student ID","Examinations taken","Average","Best","Pass rate"];
  const data=list.map((x,i)=>[String(i+1),x.name,x.code,num(x.exams),pc(x.s.avg),pc(x.s.hi),pc(x.s.pass)]);
  S.view.students={head,data};
  table(head,data,{});
}
function table(head,data,o){
  const pages=Math.max(1,Math.ceil(data.length/PAGE));
  if(S.page>pages)S.page=pages;
  const slice=data.slice((S.page-1)*PAGE,S.page*PAGE);
  if(!data.length){$("table").innerHTML='<div class="empty">No results to show for this selection.</div>';$("pager").innerHTML="";return}
  $("table").innerHTML=`<div class="wrapx"><table><thead><tr>${head.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${
    slice.map(r=>`<tr>${r.map((c,i)=>`<td${i===o.resultCol?` class="${c==="Pass"?"pass":c==="Fail"?"fail":""}"`:""}>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  $("pager").innerHTML=`<span class="muted">Showing ${(S.page-1)*PAGE+1}–${(S.page-1)*PAGE+slice.length} of ${data.length}</span>
    <span><button class="btn light" id="pPrev" type="button" ${S.page<=1?"disabled":""}>← Previous</button> <button class="btn light" id="pNext" type="button" ${S.page>=pages?"disabled":""}>Next →</button></span>`;
  $("pPrev").onclick=()=>{S.page--;draw()};$("pNext").onclick=()=>{S.page++;draw()};
}

$("search").addEventListener("input",e=>{S.search=e.target.value;S.page=1;draw()});
$("printBtn").addEventListener("click",()=>window.print());
$("csvBtn").addEventListener("click",()=>{
  const v=S.view[S.sub];if(!v||!v.data.length)return say("There is nothing to download for this selection.","info");
  const q=c=>'"'+String(c??"").replace(/"/g,'""')+'"';
  const csv="\uFEFF"+[v.head,...v.data].map(r=>r.map(q).join(",")).join("\r\n");
  const url=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  const a=document.createElement("a");a.href=url;a.download="performance-"+S.sub+"-"+(space==="class"?"class":"teacher")+".csv";
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
});

/* ---------- access guard, sign out, start ---------- */
let ended=false;
function signedOut(){
  if(ended)return;ended=true;
  const b=document.createElement("div");
  b.style.cssText="position:fixed;inset:0;z-index:99999;background:#000a;display:flex;align-items:center;justify-content:center;padding:20px";
  b.innerHTML='<div style="background:#fff;color:#263449;max-width:420px;border-radius:12px;padding:24px;text-align:center;font:17px/1.5 Arial,sans-serif"><b style="font-size:20px">You have been signed out</b><p style="margin:10px 0 0">Your session has ended or your account has been suspended. Please contact the administrator if you think this is a mistake.</p></div>';
  document.body.appendChild(b);setTimeout(()=>location.replace(LOGIN+"?mode=login"),4000);
}
async function guard(){
  if(ended||document.visibilityState==="hidden")return;
  const {data}=await sb.auth.getSession();if(!data||!data.session)return;
  const {data:st}=await sb.rpc("my_access_status");
  let stop=!!(st&&st.blocked);
  if(!stop){const {error}=await sb.auth.getUser();stop=!!(error&&(error.status===401||error.status===403))}
  if(stop){try{await sb.auth.signOut({scope:"local"})}catch(e){}signedOut()}
}
$("signOutBtn").addEventListener("click",async()=>{
  ended=true;$("signOutBtn").disabled=true;$("signOutBtn").textContent="Signing out…";
  try{await sb.auth.signOut()}finally{location.replace(LOGIN)}
});

async function init(){
  const {data:s,error}=await sb.auth.getSession();
  if(error||!s.session){location.replace(LOGIN);return}
  const {data:a,error:ae}=await sb.from("school_accounts").select("id,account_name,account_type,status").eq("user_id",s.session.user.id).maybeSingle();
  if(ae){say("Unable to load your account: "+ae.message,"err");return}
  if(!a){say("No Teacher/School account is linked to this login. Please contact the administrator.","err");return}
  if(a.status!=="active"){await sb.auth.signOut();location.replace(LOGIN);return}
  acc=a;
  const name=a.account_name||"Teacher/School";
  $("sideName").textContent=name;$("topAccount").textContent=name;
  $("sideType").textContent=a.account_type==="school"?"School Account":"Teacher Account";
  $("sideAvatar").textContent=String(name).trim().split(/\s+/).slice(0,2).map(x=>x[0]||"").join("").toUpperCase()||"SE";
  paint();show();
  setTimeout(guard,3000);setInterval(guard,15000);
  document.addEventListener("visibilitychange",guard);
}
init();
</script>
