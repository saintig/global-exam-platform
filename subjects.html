<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Subjects | SAINTIG EXAMS</title>

<style>
:root{
  --navy:#142b52;
  --blue:#2457a7;
  --gold:#d4af37;
  --bg:#f4f6fa;
  --white:#fff;
  --text:#263248;
  --muted:#68758a;
  --border:#e1e6ef;
  --danger:#c0392b;
  --green:#16834a;
}

*{box-sizing:border-box;}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

header{
  background:var(--navy);
  color:#fff;
  padding:17px 20px;
  border-bottom:4px solid var(--gold);
}

header h2{
  margin:0;
  font-size:20px;
}

header p{
  margin:5px 0 0;
  font-size:13px;
  opacity:.85;
}

.logout{
  float:right;
  background:#fff;
  color:var(--navy);
}

.container{
  max-width:1150px;
  margin:22px auto;
  padding:0 15px;
}

.nav{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:20px;
}

.nav a{
  text-decoration:none;
  background:#fff;
  color:var(--navy);
  border:1px solid var(--border);
  border-radius:7px;
  padding:10px 13px;
  font-size:13px;
  font-weight:bold;
}

.nav a.active{
  background:var(--navy);
  color:#fff;
}

.card{
  background:#fff;
  border:1px solid var(--border);
  border-radius:10px;
  padding:20px;
  margin-bottom:20px;
}

.card h3{
  margin:0 0 16px;
  color:var(--navy);
}

label{
  display:block;
  margin:13px 0 6px;
  font-size:13px;
  font-weight:bold;
}

input,
select{
  width:100%;
  padding:12px;
  border:1px solid #ccd4e0;
  border-radius:7px;
  background:#fff;
  font-size:14px;
}

button{
  border:0;
  border-radius:7px;
  padding:10px 14px;
  cursor:pointer;
  font-size:13px;
  font-weight:bold;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.primary{
  background:var(--navy);
  color:#fff;
}

.secondary{
  background:#e9eef7;
  color:var(--navy);
}

.success{
  background:#e2f5e9;
  color:var(--green);
}

.danger{
  background:#fde9e7;
  color:var(--danger);
}

.form-button{
  width:100%;
  margin-top:17px;
  padding:13px;
}

.filters{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:12px;
  margin-bottom:15px;
}

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  min-width:750px;
  border-collapse:collapse;
}

th,
td{
  padding:12px 10px;
  border-bottom:1px solid var(--border);
  text-align:left;
  font-size:13px;
}

th{
  background:#f5f7fb;
  color:var(--navy);
}

.actions{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}

.status{
  padding:5px 9px;
  border-radius:20px;
  font-size:11px;
  font-weight:bold;
}

.active{
  background:#e2f5e9;
  color:var(--green);
}

.inactive{
  background:#f0f1f4;
  color:#667085;
}

.message{
  display:none;
  padding:11px;
  margin-top:12px;
  border-radius:7px;
  font-size:13px;
}

.message.error{
  display:block;
  background:#fde9e7;
  color:var(--danger);
}

.message.ok{
  display:block;
  background:#e2f5e9;
  color:var(--green);
}

.empty{
  text-align:center;
  padding:25px;
  color:var(--muted);
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:100;
  align-items:center;
  justify-content:center;
  padding:15px;
}

.modal-box{
  background:#fff;
  width:100%;
  max-width:450px;
  border-radius:10px;
  padding:20px;
}

.modal-box h3{
  color:var(--navy);
  margin-top:0;
}

.modal-actions{
  display:flex;
  gap:8px;
  margin-top:18px;
}

.small-note{
  color:var(--muted);
  font-size:12px;
}

@media(max-width:700px){
  .filters{
    grid-template-columns:1fr;
  }

  .card{
    padding:15px;
  }
}
</style>
</head>

<body>

<header>

<button id="logoutBtn" class="logout">Sign Out</button>

<h2>SAINTIG EXAMS</h2>

<p>Subject Management</p>

</header>

<div class="container">

<nav class="nav">

<a href="admin.html">Dashboard</a>

<a href="countries.html">Countries</a>

<a href="education-levels.html">Education Levels</a>

<a href="subjects.html" class="active">Subjects</a>

<a href="question-bank.html">Question Bank</a>

</nav>


<!-- ADD SUBJECT -->

<section class="card">

<h3 id="formTitle">Add Subject</h3>

<form id="subjectForm">

<label>Select Country</label>

<select id="countrySelect" required>

<option value="">Loading countries...</option>

</select>


<label>Select Education Level</label>

<select id="levelSelect" required disabled>

<option value="">Select a country first</option>

</select>


<label>Subject Name</label>

<input
id="subjectName"
type="text"
maxlength="100"
placeholder="e.g. Mathematics"
required
>


<button
type="submit"
id="saveBtn"
class="primary form-button"
>

Add Subject

</button>


<button
type="button"
id="cancelEditBtn"
class="secondary form-button"
style="display:none"
>

Cancel Editing

</button>

<div id="formMessage" class="message"></div>

</form>

</section>



<!-- MANAGE SUBJECTS -->

<section class="card">

<h3>Manage Existing Subjects</h3>


<div class="filters">

<div>

<label>Filter by Country</label>

<select id="countryFilter">

<option value="">All Countries</option>

</select>

</div>


<div>

<label>Filter by Education Level</label>

<select id="levelFilter" disabled>

<option value="">All Education Levels</option>

</select>

</div>


<div>

<label>Search Subjects</label>

<input
id="searchInput"
type="search"
placeholder="Search subjects..."
>

</div>

</div>


<p class="small-note" id="recordCount"></p>


<div class="table-wrap">

<table>

<thead>

<tr>

<th>Country</th>

<th>Education Level</th>

<th>Subject</th>

<th>Status</th>

<th>Actions</th>

</tr>

</thead>


<tbody id="subjectsTable">

<tr>

<td colspan="5" class="empty">

Loading subjects...

</td>

</tr>

</tbody>

</table>

</div>

<div id="listMessage" class="message"></div>

</section>

</div>



<!-- DETAILS MODAL -->

<div class="modal" id="detailsModal">

<div class="modal-box">

<h3>Subject Details</h3>

<div id="detailsContent"></div>

<div class="modal-actions">

<button id="closeModalBtn" class="primary">

Close

</button>

</div>

</div>

</div>



<script type="module">

import { supabase } from "./auth.js";

const $ = id => document.getElementById(id);

let countries = [];

let levels = [];

let subjectAssignments = [];

let subjects = [];

let editingSubjectId = null;

let busy = false;



function showMessage(element,message,type){

  element.textContent = message;

  element.className = "message " + type;

}


function clearMessage(element){

  element.textContent = "";

  element.className = "message";

}


function escapeHTML(value){

  return String(value ?? "").replace(/[&<>"']/g,char => ({

    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"

  })[char]);

}



/* SECURITY CHECK */

async function verifyAccess(){

  const {data:userData,error:authError} =
    await supabase.auth.getUser();


  if(authError || !userData?.user){

    location.replace("admin-login.html");

    return false;

  }


  const {data:allowed,error} =
    await supabase.rpc(
      "has_admin_permission",
      {
        p_permission:"manage_subjects"
      }
    );


  if(error || allowed !== true){

    document.body.innerHTML = `

      <div style="padding:35px;font-family:Arial">

        <h2>Access denied</h2>

        <p>You do not have permission to manage subjects.</p>

        <a href="admin.html">

        Return to dashboard

        </a>

      </div>

    `;

    return false;

  }


  return true;

}



/* LOAD COUNTRIES */

async function loadCountries(){

  const {data,error} =
    await supabase
      .from("education_systems")
      .select("id,country_name,is_active")
      .order("country_name");


  if(error) throw error;


  countries = data || [];


  const options =
    countries.map(country => `

      <option value="${country.id}">

        ${escapeHTML(country.country_name)}

      </option>

    `).join("");


  $("countrySelect").innerHTML =

    `<option value="">Select Country</option>` +

    options;


  $("countryFilter").innerHTML =

    `<option value="">All Countries</option>` +

    options;

}



/* LOAD EDUCATION LEVELS */

async function loadLevels(countryId,selectElement){

  selectElement.innerHTML =
    `<option value="">Loading...</option>`;


  selectElement.disabled = true;


  if(!countryId){

    selectElement.innerHTML =
      `<option value="">Select a country first</option>`;

    return;

  }


  const {data,error} =
    await supabase
      .from("education_levels")
      .select("id,education_system_id,level_name,is_active")
      .eq("education_system_id",countryId)
      .order("level_name");


  if(error){

    selectElement.innerHTML =
      `<option value="">Unable to load levels</option>`;

    return;

  }


  levels = data || [];


  selectElement.innerHTML =

    `<option value="">Select Education Level</option>` +

    levels.map(level => `

      <option value="${level.id}">

        ${escapeHTML(level.level_name)}

      </option>

    `).join("");


  selectElement.disabled = false;

}



/* LOAD SUBJECT DATA */

async function loadSubjects(){

  clearMessage($("listMessage"));


  const {data:subjectData,error:subjectError} =
    await supabase
      .from("subjects")
      .select("id,name,description,is_active,created_at")
      .order("name");


  if(subjectError){

    showMessage(
      $("listMessage"),
      subjectError.message,
      "error"
    );

    return;

  }


  subjects = subjectData || [];


  const {data:assignmentData,error:assignmentError} =
    await supabase
      .from("education_level_subjects")
      .select(
        "id,education_level_id,subject_id,is_active"
      );


  if(assignmentError){

    showMessage(
      $("listMessage"),
      assignmentError.message,
      "error"
    );

    return;

  }


  subjectAssignments =
    assignmentData || [];


  renderSubjects();

}



/* GET NAMES */

function getCountryName(countryId){

  const country =
    countries.find(
      item =>
      String(item.id) === String(countryId)
    );


  return country ?
    country.country_name :
    "Unknown";

}


function getLevel(levelId){

  return levels.find(
    item =>
    String(item.id) === String(levelId)
  );

}



/* RENDER SUBJECTS */

function renderSubjects(){

  const countryId =
    $("countryFilter").value;


  const levelId =
    $("levelFilter").value;


  const search =
    $("searchInput")
      .value
      .trim()
      .toLowerCase();


  let rows = [];


  subjectAssignments.forEach(assignment => {

    const subject =
      subjects.find(
        item =>
        String(item.id) ===
        String(assignment.subject_id)
      );


    if(!subject) return;


    let level = null;


    /* Load from existing list when available */

    level =
      levels.find(
        item =>
        String(item.id) ===
        String(assignment.education_level_id)
      );


    if(!level) return;


    const countryMatch =

      !countryId ||

      String(level.education_system_id) ===
      String(countryId);


    const levelMatch =

      !levelId ||

      String(level.id) ===
      String(levelId);


    const searchMatch =

      subject.name
        .toLowerCase()
        .includes(search);


    if(countryMatch &&
       levelMatch &&
       searchMatch){

      rows.push({

        assignment,
        subject,
        level

      });

    }

  });


  $("recordCount").textContent =
    `${rows.length} subject record(s) displayed`;


  if(!rows.length){

    $("subjectsTable").innerHTML = `

      <tr>

      <td colspan="5" class="empty">

      No subjects found.

      </td>

      </tr>

    `;

    return;

  }


  $("subjectsTable").innerHTML =
    rows.map(row => `

<tr>

<td>

${escapeHTML(
  getCountryName(
    row.level.education_system_id
  )
)}

</td>


<td>

${escapeHTML(
  row.level.level_name
)}

</td>


<td>

${escapeHTML(
  row.subject.name
)}

</td>


<td>

<span class="status ${
  row.assignment.is_active
  ? "active"
  : "inactive"
}">

${
  row.assignment.is_active
  ? "Published"
  : "Unpublished"
}

</span>

</td>


<td>

<div class="actions">


<button
class="secondary"
data-action="view"
data-id="${row.assignment.id}"
>

View

</button>


<button
class="primary"
data-action="edit"
data-id="${row.assignment.id}"
>

Edit

</button>


<button
class="success"
data-action="toggle"
data-id="${row.assignment.id}"
>

${
  row.assignment.is_active
  ? "Unpublish"
  : "Publish"
}

</button>


<button
class="danger"
data-action="delete"
data-id="${row.assignment.id}"
>

Delete

</button>


</div>

</td>

</tr>

`).join("");

}



/* ADD / EDIT SUBJECT */

$("subjectForm").addEventListener(
  "submit",
  async event => {

event.preventDefault();


if(busy) return;


const countryId =
  $("countrySelect").value;


const levelId =
  $("levelSelect").value;


const subjectName =
  $("subjectName")
    .value
    .trim();


if(!countryId ||
   !levelId ||
   !subjectName){

  showMessage(
    $("formMessage"),
    "Complete all required fields.",
    "error"
  );

  return;

}


busy = true;

$("saveBtn").disabled = true;


try{


/* CREATE SUBJECT */

const {data:existingSubject} =
  await supabase
    .from("subjects")
    .select("id")
    .eq("name",subjectName)
    .maybeSingle();


let subjectId;


if(existingSubject){

  subjectId =
    existingSubject.id;

}else{

  const {data:newSubject,error} =
    await supabase
      .from("subjects")
      .insert({

        name:subjectName,

        is_active:true

      })
      .select()
      .single();


  if(error) throw error;


  subjectId =
    newSubject.id;

}


/* ASSIGN SUBJECT TO LEVEL */

if(editingSubjectId !== null){

  const {error} =
    await supabase
      .from("education_level_subjects")
      .update({

        education_level_id:levelId,

        subject_id:subjectId

      })
      .eq(
        "id",
        editingSubjectId
      );


  if(error) throw error;


  showMessage(
    $("formMessage"),
    "Subject updated successfully.",
    "ok"
  );


}else{

  const {error} =
    await supabase
      .from("education_level_subjects")
      .insert({

        education_level_id:levelId,

        subject_id:subjectId,

        is_active:true

      });


  if(error) throw error;


  showMessage(
    $("formMessage"),
    "Subject added successfully.",
    "ok"
  );

}


resetForm();

await loadSubjects();


}catch(error){

showMessage(
  $("formMessage"),
  "Operation failed: " +
  error.message,
  "error"
);


}finally{

busy = false;

$("saveBtn").disabled = false;

}

});



/* COUNTRY CHANGE */

$("countrySelect")
.addEventListener(
  "change",
  async () => {

await loadLevels(
  $("countrySelect").value,
  $("levelSelect")
);

});



/* FILTER COUNTRY CHANGE */

$("countryFilter")
.addEventListener(
  "change",
  async () => {

const countryId =
  $("countryFilter").value;


await loadLevels(
  countryId,
  $("levelFilter")
);


renderSubjects();

});



$("levelFilter")
.addEventListener(
  "change",
  renderSubjects
);


$("searchInput")
.addEventListener(
  "input",
  renderSubjects
);



/* TABLE ACTIONS */

$("subjectsTable")
.addEventListener(
  "click",
  async event => {

const button =
  event.target.closest(
    "button[data-action]"
  );


if(!button) return;


const id =
  button.dataset.id;


const action =
  button.dataset.action;


const assignment =
  subjectAssignments.find(
    item =>
    String(item.id) ===
    String(id)
  );


if(!assignment) return;


/* VIEW */

if(action === "view"){

  const subject =
    subjects.find(
      item =>
      String(item.id) ===
      String(assignment.subject_id)
    );


  const level =
    levels.find(
      item =>
      String(item.id) ===
      String(
        assignment.education_level_id
      )
    );


  $("detailsContent").innerHTML = `

<p>

<strong>Subject:</strong>

${escapeHTML(subject?.name)}

</p>


<p>

<strong>Education Level:</strong>

${escapeHTML(level?.level_name)}

</p>


<p>

<strong>Status:</strong>

${
  assignment.is_active
  ? "Published"
  : "Unpublished"
}

</p>

`;


  $("detailsModal").style.display =
    "flex";

}


/* EDIT */

if(action === "edit"){

editingSubjectId =
  assignment.id;


const subject =
  subjects.find(
    item =>
    String(item.id) ===
    String(assignment.subject_id)
  );


const level =
  levels.find(
    item =>
    String(item.id) ===
    String(
      assignment.education_level_id
    )
  );


if(level){

  $("countrySelect").value =
    level.education_system_id;


  await loadLevels(
    level.education_system_id,
    $("levelSelect")
  );


  $("levelSelect").value =
    level.id;

}


$("subjectName").value =
  subject?.name || "";


$("formTitle").textContent =
  "Edit Subject";


$("saveBtn").textContent =
  "Save Changes";


$("cancelEditBtn").style.display =
  "block";


window.scrollTo({

  top:0,

  behavior:"smooth"

});

}


/* PUBLISH / UNPUBLISH */

if(action === "toggle"){

const newStatus =
  !assignment.is_active;


const {error} =
  await supabase
    .from("education_level_subjects")
    .update({

      is_active:newStatus

    })
    .eq("id",id);


if(error){

showMessage(
  $("listMessage"),
  error.message,
  "error"
);

return;

}


await loadSubjects();

}


/* DELETE */

if(action === "delete"){

if(!confirm(
  "Are you sure you want to delete this subject assignment?"
)) return;


const {error} =
  await supabase
    .from("education_level_subjects")
    .delete()
    .eq("id",id);


if(error){

showMessage(
  $("listMessage"),
  error.message,
  "error"
);

return;

}


await loadSubjects();


showMessage(
  $("listMessage"),
  "Subject removed successfully.",
  "ok"
);

}

});



/* CANCEL EDIT */

function resetForm(){

editingSubjectId = null;

$("subjectForm").reset();

$("levelSelect").disabled = true;

$("levelSelect").innerHTML =
  `<option value="">
  Select a country first
  </option>`;


$("formTitle").textContent =
  "Add Subject";


$("saveBtn").textContent =
  "Add Subject";


$("cancelEditBtn").style.display =
  "none";

}


$("cancelEditBtn")
.addEventListener(
  "click",
  resetForm
);



/* CLOSE MODAL */

$("closeModalBtn")
.addEventListener(
  "click",
  () => {

$("detailsModal").style.display =
  "none";

});



/* LOGOUT */

$("logoutBtn")
.addEventListener(
  "click",
  async () => {

await supabase.auth.signOut();

location.replace(
  "admin-login.html"
);

});



/* INITIALIZE */

async function initializePage(){

try{

const allowed =
  await verifyAccess();


if(!allowed) return;


await loadCountries();


await loadLevels(
  $("countryFilter").value,
  $("levelFilter")
);


await loadSubjects();


}catch(error){

showMessage(
  $("formMessage"),
  "Unable to initialize page: " +
  error.message,
  "error"
);

}

}


initializePage();

</script>

</body>
</html>
